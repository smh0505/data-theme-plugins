name: Release Theme Plugins

on:
  push:
    branches: [main]
    paths:
      - "themes/**"
  workflow_dispatch: {}

permissions:
  contents: write
  # Matches the other 7 plugin repos' Milestone 14 signing setup - id-token lets the job
  # request a short-lived Sigstore signing cert bound to this exact workflow run's OIDC
  # identity; attestations lets it publish the resulting provenance attestation via GitHub's
  # API. Free for public repos.
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      themes: ${{ steps.list.outputs.themes }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun run scripts/validate.mjs
      - id: list
        run: echo "themes=$(ls themes | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  release:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Every theme's manifest is literally named manifest.json, so GitHub Release assets
      # (which must have unique filenames within one release) need each one renamed to its
      # theme id before upload.
      - name: Stage renamed manifests
        run: |
          mkdir -p dist
          echo '${{ needs.validate.outputs.themes }}' | jq -r '.[]' | while read -r theme; do
            cp "themes/$theme/manifest.json" "dist/$theme.json"
          done

      # Milestone 14/17 (Concourse) - signs every theme's manifest with a Sigstore attestation
      # binding it to this exact workflow run (repo + commit + workflow file), the same
      # mechanism the other 7 plugin repos use for their .wasm binaries. A data-only theme has
      # no binary - the manifest itself is the whole artifact, so it's what gets attested.
      # subject-path accepts a glob, producing one attestation per matching file in this single
      # step rather than needing a separate step per theme.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.json"

      - name: Build release notes
        id: notes
        run: |
          {
            echo "body<<RELEASE_BODY_EOF"
            echo "Auto-published by CI. Paste a theme's URL into Concourse's Settings ->"
            echo "Theme tab (or the universal Add Plugin button) to install it:"
            echo
            echo '${{ needs.validate.outputs.themes }}' | jq -r '.[]' | while read -r theme; do
              echo "- \`$theme\`: https://github.com/smh0505/data-theme-plugins/releases/download/themes/$theme.json"
            done
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # One stable release for all themes, tag reused across pushes - keeps each theme's
      # download URL pasted into the app's install-by-URL field constant across updates,
      # instead of forcing a manual reinstall every time a theme's cssVariables change.
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: themes
          name: Themes
          files: dist/*.json
          body: ${{ steps.notes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write job summary
        run: |
          {
            echo "### Published themes"
            echo
            echo "Paste a theme's URL into Concourse's Settings -> Theme tab (or the universal"
            echo "Add Plugin button) to install it:"
            echo
            echo '${{ needs.validate.outputs.themes }}' | jq -r '.[]' | while read -r theme; do
              echo "- \`$theme\`: https://github.com/smh0505/data-theme-plugins/releases/download/themes/$theme.json"
            done
          } >> "$GITHUB_STEP_SUMMARY"
