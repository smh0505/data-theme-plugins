name: Release Theme Plugins

on:
  push:
    branches: [main]
    paths:
      - "themes/**"
  workflow_dispatch: {}

permissions:
  contents: write
  # Matches the other 7 plugin repos' Milestone 14 signing setup - id-token lets the job
  # request a short-lived Sigstore signing cert bound to this exact workflow run's OIDC
  # identity; attestations lets it publish the resulting provenance attestation via GitHub's
  # API. Free for public repos.
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      themes: ${{ steps.list.outputs.themes }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun run scripts/validate.mjs
      - id: list
        run: echo "themes=$(ls themes | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  release:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history) - the "changed themes" step below diffs
      # github.event.before against github.sha, which needs both commits present locally.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Every theme's manifest is literally named manifest.json, so GitHub Release assets
      # (which must have unique filenames within one release) need each one renamed to its
      # theme id before upload.
      - name: Stage renamed manifests
        run: |
          mkdir -p dist
          echo '${{ needs.validate.outputs.themes }}' | jq -r '.[]' | while read -r theme; do
            cp "themes/$theme/manifest.json" "dist/$theme.json"
          done

      # Milestone 14/17 (Concourse) - signs every theme's manifest with a Sigstore attestation
      # binding it to this exact workflow run (repo + commit + workflow file), the same
      # mechanism the other 7 plugin repos use for their .wasm binaries. A data-only theme has
      # no binary - the manifest itself is the whole artifact, so it's what gets attested.
      # subject-path accepts a glob, producing one attestation per matching file in this single
      # step rather than needing a separate step per theme.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*.json"

      - name: Build release notes
        id: notes
        run: |
          {
            echo "body<<RELEASE_BODY_EOF"
            echo "Auto-published by CI. Paste a theme's URL into Concourse's Settings ->"
            echo "Theme tab (or the universal Add Plugin button) to install it:"
            echo
            echo '${{ needs.validate.outputs.themes }}' | jq -r '.[]' | while read -r theme; do
              echo "- \`$theme\`: https://github.com/smh0505/data-theme-plugins/releases/download/themes/$theme.json"
            done
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # One stable release for all themes, tag reused across pushes - keeps each theme's
      # download URL pasted into the app's install-by-URL field constant across updates,
      # instead of forcing a manual reinstall every time a theme's cssVariables change.
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: themes
          name: Themes
          files: dist/*.json
          body: ${{ steps.notes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write job summary
        run: |
          {
            echo "### Published themes"
            echo
            echo "Paste a theme's URL into Concourse's Settings -> Theme tab (or the universal"
            echo "Add Plugin button) to install it:"
            echo
            echo '${{ needs.validate.outputs.themes }}' | jq -r '.[]' | while read -r theme; do
              echo "- \`$theme\`: https://github.com/smh0505/data-theme-plugins/releases/download/themes/$theme.json"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Only meaningful for push events - github.event.before doesn't exist for a manual
      # workflow_dispatch run, and a manual re-publish isn't "new content" worth dispatching
      # over anyway. Every push here re-validates/republishes *every* theme regardless of which
      # one actually changed, so diffing before..head is what tells changed themes apart from
      # ones just carried along - dispatching for all of them every time would open a no-op PR
      # for every untouched theme alongside the one real change.
      - name: Determine changed themes
        if: github.event_name == 'push'
        id: changed
        run: |
          changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
              -- 'themes/*/manifest.json' \
            | sed -E 's#themes/([^/]+)/manifest\.json#\1#' \
            | sort -u \
            | jq -R -s -c 'split("\n")[:-1]')
          echo "themes=$changed" >> "$GITHUB_OUTPUT"

      # Notifies concourse-plugin-registry per changed theme, same mechanism the other 7 plugin
      # repos use inline in their own publish.yml (a separate release:published-triggered
      # workflow wouldn't fire - see those repos' own comment on this). ref is a commit SHA
      # here, not a version tag - this repo has no per-theme version tags, see bump-entry.sh in
      # concourse-plugin-registry for how that's handled on the receiving end.
      - name: Notify concourse-plugin-registry for each changed theme
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_DISPATCH_TOKEN }}
        run: |
          echo '${{ steps.changed.outputs.themes }}' | jq -r '.[]' | while read -r theme; do
            [ -z "$theme" ] && continue
            gh api repos/smh0505/concourse-plugin-registry/dispatches \
              -f event_type=plugin-release \
              -f "client_payload[id]=$theme" \
              -f "client_payload[ref]=${{ github.sha }}"
          done
